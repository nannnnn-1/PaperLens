name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  lint-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./apps/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  lint-ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ./apps/ai/requirements.txt
      - run: pip install -r requirements.txt
      - run: flake8 app --max-line-length=100 --extend-ignore=E203
